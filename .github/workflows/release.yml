name: release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # allow creating GitHub releases
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # semantic-release needs full history

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build (Linux x86_64)
        run: |
          mkdir -p dist
          gcc -o dist/client ifshow_client.c
          strip dist/client || true
          tar -C dist -czf dist/client.tgz client

          gcc -o dist/server ifshow_server.c
          strip dist/server || true
          tar -C dist -czf dist/server.tgz server

      - name: Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}